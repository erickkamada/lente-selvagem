{% extends 'base.html' %}

{% block title %}Remover post{% endblock %}

{% block content %}
<section class="form-page confirm">
  <p class="eyebrow">Confirmar remoção</p>
  <h1>Remover “{{ post.title }}”?</h1>
  <p>Esta ação apaga o post de forma permanente e não pode ser desfeita.</p>

  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button type="submit" class="btn btn-danger">Sim, remover</button>
      <a href="{% url 'blog:post_detail' post.pk %}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
