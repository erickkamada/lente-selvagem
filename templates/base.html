{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Posts{% endblock %} · Lente Selvagem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="{% url 'blog:post_list' %}">
        Lente <span>Selvagem</span>
        <small>fotografia da natureza</small>
      </a>
      <nav class="main-nav">
        <a href="{% url 'blog:post_list' %}">Posts</a>
        <a href="{% url 'admin:index' %}">Admin</a>
        <a href="{% url 'blog:post_create' %}" class="btn">Novo post</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">Lente Selvagem · blog de fotografia da natureza feito com Django</div>
  </footer>
</body>
</html>
